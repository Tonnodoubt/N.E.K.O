<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>Tile Annotation Review</title>
<style>
body{background:#1a1a2e;color:#eee;font-family:-apple-system,sans-serif;padding:16px}
h1{font-size:18px} .nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
button{background:#16213e;color:#eee;border:1px solid #333;padding:5px 12px;border-radius:4px;cursor:pointer}
button:disabled{opacity:.4} .counter{color:#888;font-size:13px}
img{max-width:100%;border:2px solid #333;border-radius:4px}
.section{background:#16213e;border-radius:6px;padding:12px;margin-top:10px}
h2{font-size:14px;color:#e94560;margin-bottom:6px}
pre{background:#0a0a1a;padding:10px;border-radius:4px;font-size:11px;overflow-x:auto;white-space:pre-wrap;max-height:300px;overflow-y:auto}
</style></head><body>
<h1>Tile Annotation Review</h1>
<p style="color:#888;font-size:11px">Pipeline output with calibration. Check hand tiles and discard piles match the screenshot.</p>
<div class="nav">
<button id="prev" onclick="nav(-1)">&#9664; Prev</button>
<span class="counter" id="ctr"></span>
<button id="next" onclick="nav(1)">Next &#9654;</button>
</div>
<div id="content"></div>
<script>
let idx=0;
const D=[{"theme_id": "cartoon_red", "image_name": "screenshot_03.png", "img": "cartoon_red_screenshot_03_annotated.png", "json_file": "cartoon_red_screenshot_03.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_04.png", "img": "cartoon_red_screenshot_04_annotated.png", "json_file": "cartoon_red_screenshot_04.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_05.png", "img": "cartoon_red_screenshot_05_annotated.png", "json_file": "cartoon_red_screenshot_05.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_06.png", "img": "cartoon_red_screenshot_06_annotated.png", "json_file": "cartoon_red_screenshot_06.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_12.png", "img": "cartoon_red_screenshot_12_annotated.png", "json_file": "cartoon_red_screenshot_12.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_13.png", "img": "cartoon_red_screenshot_13_annotated.png", "json_file": "cartoon_red_screenshot_13.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_14.png", "img": "cartoon_red_screenshot_14_annotated.png", "json_file": "cartoon_red_screenshot_14.json"}, {"theme_id": "cartoon_red", "image_name": "screenshot_15.png", "img": "cartoon_red_screenshot_15_annotated.png", "json_file": "cartoon_red_screenshot_15.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_02.png", "img": "watermelon_summer_screenshot_02_annotated.png", "json_file": "watermelon_summer_screenshot_02.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_07.png", "img": "watermelon_summer_screenshot_07_annotated.png", "json_file": "watermelon_summer_screenshot_07.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_08.png", "img": "watermelon_summer_screenshot_08_annotated.png", "json_file": "watermelon_summer_screenshot_08.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_09.png", "img": "watermelon_summer_screenshot_09_annotated.png", "json_file": "watermelon_summer_screenshot_09.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_10.png", "img": "watermelon_summer_screenshot_10_annotated.png", "json_file": "watermelon_summer_screenshot_10.json"}, {"theme_id": "watermelon_summer", "image_name": "screenshot_11.png", "img": "watermelon_summer_screenshot_11_annotated.png", "json_file": "watermelon_summer_screenshot_11.json"}];
function nav(d){idx=Math.max(0,Math.min(D.length-1,idx+d));render()}
function render(){
  document.getElementById("ctr").textContent=(idx+1)+"/"+D.length;
  document.getElementById("prev").disabled=idx===0;
  document.getElementById("next").disabled=idx===D.length-1;
  const d=D[idx];
  fetch(d.json_file).then(r=>r.json()).then(ann=>{
    var h='<img src="'+d.img+'" />';
    h+='<div class="section"><h2>'+d.theme_id+' / '+d.image_name+'</h2>';
    h+='<pre>'+JSON.stringify(ann,null,2)+'</pre></div>';
    document.getElementById('content').innerHTML=h;
  });
}
render();
</script></body></html>
